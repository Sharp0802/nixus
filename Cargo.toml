[workspace]
members = ["crates/cli", "crates/nix"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.0"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
nixus = { path = "crates/cli" }
nixus-nix = { path = "crates/nix" }

criterion = "0.8"
proptest = "1"
tracing = "0.1"
tracing-subscriber = "0.3"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
wildcard_imports = "allow"
