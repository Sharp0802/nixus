[workspace]
members = ["crates/cli", "crates/macros", "crates/lang"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.0"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
nixus = { path = "crates/cli" }
nixus-lang = { path = "crates/lang" }
nixus-macros = { path = "crates/macros" }

criterion = "0.8"
proptest = "1"
proc-macro2 = "1.0"
quote = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
venial = "0.6.1"

[workspace.lints.rust]
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
wildcard_imports = "allow"
